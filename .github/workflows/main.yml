name: 'Rebol-Zstd CI'
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.1

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static Zstd library
      run: ./siskin Rebol-Zstd.nest cmake-zstd-x64
    - name: Build 64bit Rebol/Zstd extension
      run: ./siskin Rebol-Zstd.nest -o ./zstd-windows-x64.rebx --msvc zstd-x64
    - name: Minimal Rebol/Zstd extension test
      run:  ./siskin --script ci-test.r3

    - name: Build 32bit static Zstd library
      run: ./siskin Rebol-Zstd.nest cmake-zstd-x86
    - name: Build 32bit Rebol/Zstd extension
      run: ./siskin Rebol-Zstd.nest -o ./zstd-windows-x86.rebx --msvc zstd-x86

    - name: Build arm64 static Zstd library
      run: ./siskin Rebol-Zstd.nest cmake-zstd-arm64
    - name: Build arm64 Rebol/Zstd extension
      run: ./siskin Rebol-Zstd.nest -o ./zstd-windows-arm64.rebx --msvc zstd-arm64

    - name: Upload unsigned artifact
      id: upload-unsigned
      uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zstd-Windows-CI-${{github.run_id}}-unsigned
        path: ./*.rebx

    - name: Sign with SignPath
      if: github.event_name != 'pull_request'
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
        project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
        signing-policy-slug: 'test-signing'
        #signing-policy-slug: ${{ github.event_name == 'workflow_dispatch' && 'release-signing' || 'test-signing' }}
        artifact-configuration-slug: 'windows-rebx'
        github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: './signed'

    - name: Upload signed artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zstd-Windows-CI-${{github.run_id}}-signed
        path: ./signed/*.rebx


  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.1

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static Zstd library
      run: ./siskin Rebol-Zstd.nest cmake-zstd-x64
    - name: Build 64bit Rebol/Zstd extension
      run: ./siskin Rebol-Zstd.nest -o ./zstd-linux-x64.rebx --gzip zstd-x64
    - name: Minimal Rebol/Zstd extension test
      run:  ./siskin --script ci-test.r3

    - name: Prepare 32bit gcc
      run: sudo apt install gcc-multilib g++-multilib
    - name: Build 32bit static Zstd library
      run: ./siskin Rebol-Zstd.nest cmake-zstd-x86
    - name: Build 32bit Rebol/Zstd extension
      run: ./siskin Rebol-Zstd.nest -o ./zstd-linux-x86.rebx --gzip zstd-x86

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zstd-Linux-CI-${{github.run_id}}
        path: ./*.gz

  macos-arm:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.1
      with:
        arch: aarch64

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build arm64 static Zstd library
      run: ./siskin Rebol-Zstd.nest cmake-zstd-arm64

    - name: Build arm64 Rebol/Zstd extension
      run: ./siskin Rebol-Zstd.nest -o ./zstd-macos-arm64.rebx --gzip zstd-arm64

    - name: Minimal Rebol/Zstd extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zstd-macOS-arm-CI-${{github.run_id}}
        path: ./*.gz

  macos-x64:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.1

    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build x64 static Zstd library
      run: ./siskin Rebol-Zstd.nest cmake-zstd-x64
    - name: Build x64 Rebol/Zstd extension
      run: ./siskin Rebol-Zstd.nest -o ./zstd-macos-x64.rebx --gzip zstd-x64
    - name: Minimal Rebol/Zstd extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Zstd-macOS-x64-CI-${{github.run_id}}
        path: ./*.gz